# Board-neutral config. Board-specific options, such as RTT on the Nordic DKs, live in
# boards/<board>.conf, which Zephyr merges in by board name.

CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048

# C++23 with the full GNU libstdc++, so std::array, std::string_view, std::chrono etc. work.
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_RTTI=y

# libstdc++ needs a full libc. Asks for one rather than naming newlib or picolibc,
# so each toolchain picks the one it ships.
CONFIG_REQUIRES_FULL_LIBC=y

# Backs operator new and the STL containers (default 0, no heap).
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_GPIO=y
