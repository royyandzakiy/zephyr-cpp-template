sample:
  name: Zephyr C++ template
  description: C++23 blinky that logs each LED transition

common:
  tags:
    - cpp

tests:
  template.blinky.build:
    build_only: true
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf52840dk/nrf52840
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp

  # Runs the image on the host and checks the log, so CI needs no board.
  template.blinky.native_sim:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "blinking led0"
        - "LED on"
        - "LED off"
